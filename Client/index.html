<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/Hospitality.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#231F20" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Prime Hospitality — Prime Inn, Residence and Select stays across Egypt's finest destinations. Book direct."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prime Hospitality" />
    <meta property="og:title" content="Prime Hospitality — Prime stays for Prime customers" />
    <meta
      property="og:description"
      content="Prime Inn, Residence and Select stays across Egypt's finest destinations. Book direct."
    />
    <meta property="og:image" content="/brand/Hospitality.png" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <title>Prime Hospitality</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('prime_theme');
          if (t !== 'dark' && t !== 'light') t = 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Prime Hospitality needs JavaScript to show available stays.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
